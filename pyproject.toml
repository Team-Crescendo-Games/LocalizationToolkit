[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loctoolkit"
version = "0.1.0"
description = "Localization toolkit: validator and CSV exporter for game localization JSON."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
ui = [
    "streamlit>=1.32",
    "pandas>=2.1",
]

[project.scripts]
locvalidate = "loctoolkit.cli.locvalidate:main"
loc2csv = "loctoolkit.cli.loc2csv:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
